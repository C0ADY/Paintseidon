<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2d6496"/>
      <stop offset="55%"  stop-color="#1f4470"/>
      <stop offset="100%" stop-color="#15314f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="45%"  stop-color="#cfe6f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cfe6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff7e0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff7e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dceaf6"/>
    </linearGradient>
    <linearGradient id="domeFace" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e8f2fa"/>
      <stop offset="100%" stop-color="#c6dcee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="url(#sky)"/>

  <!-- divine radiance behind the sanctuary -->
  <circle cx="450" cy="235" r="250" fill="url(#halo)"/>
  <g opacity="0.09" fill="#ffffff">
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(0 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(24 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(48 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(72 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(96 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(120 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(144 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(168 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(192 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(216 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(240 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(264 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(288 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(312 450 235)"/>
    <path d="M450 235 L443 30 L457 30 Z" transform="rotate(336 450 235)"/>
  </g>
  <circle cx="450" cy="150" r="120" fill="url(#coreGlow)"/>

  <!-- rotunda: finial, dome, cornice and arcaded drum -->
  <circle cx="450" cy="62" r="7" fill="#e8c765"/>
  <rect x="447" y="68" width="6" height="14" rx="3" fill="#e8c765"/>
  <path d="M380 146 A 70 70 0 0 1 520 146 Z" fill="url(#domeFace)"/>
  <path d="M450 76 A 70 70 0 0 1 520 146 L450 146 Z" fill="#ffffff" opacity="0.3"/>
  <rect x="368" y="144" width="164" height="11" rx="5.5" fill="#f4faff"/>
  <rect x="386" y="155" width="128" height="35" fill="url(#stone)"/>
  <g fill="#2d6496" opacity="0.35">
    <path d="M402 190 L402 173 A 9 9 0 0 1 420 173 L420 190 Z"/>
    <path d="M441 190 L441 173 A 9 9 0 0 1 459 173 L459 190 Z"/>
    <path d="M480 190 L480 173 A 9 9 0 0 1 498 173 L498 190 Z"/>
  </g>

  <!-- entablature -->
  <rect x="118" y="190" width="664" height="26" rx="13" fill="url(#stone)"/>
  <rect x="118" y="209" width="664" height="7" rx="3.5" fill="#d4af37" opacity="0.8"/>

  <!-- arcade: five round arches on six columns -->
  <g fill="none" stroke="#edf5fc" stroke-width="15" stroke-linecap="round">
    <path d="M164 252 A 46 46 0 0 1 256 252"/>
    <path d="M284 252 A 46 46 0 0 1 376 252"/>
    <path d="M404 252 A 46 46 0 0 1 496 252"/>
    <path d="M524 252 A 46 46 0 0 1 616 252"/>
    <path d="M644 252 A 46 46 0 0 1 736 252"/>
  </g>

  <!-- columns with rounded capitals and bases -->
  <g fill="url(#stone)">
    <rect x="136" y="250" width="28" height="106" rx="14"/>
    <rect x="256" y="250" width="28" height="106" rx="14"/>
    <rect x="376" y="250" width="28" height="106" rx="14"/>
    <rect x="496" y="250" width="28" height="106" rx="14"/>
    <rect x="616" y="250" width="28" height="106" rx="14"/>
    <rect x="736" y="250" width="28" height="106" rx="14"/>
  </g>
  <g fill="#f4faff">
    <circle cx="150" cy="248" r="14"/><circle cx="270" cy="248" r="14"/>
    <circle cx="390" cy="248" r="14"/><circle cx="510" cy="248" r="14"/>
    <circle cx="630" cy="248" r="14"/><circle cx="750" cy="248" r="14"/>
  </g>

  <!-- rounded stepped platform -->
  <rect x="118" y="352" width="664" height="16" rx="8" fill="#f4faff"/>
  <rect x="92"  y="366" width="716" height="16" rx="8" fill="#e4eef7"/>
  <rect x="62"  y="380" width="776" height="16" rx="8" fill="#cfe0ef"/>

  <!-- sea swell beneath -->
  <path d="M0 400 Q 112 384 224 400 T 448 400 T 672 400 T 896 400 L 900 420 L 0 420 Z"
        fill="#2d6496" opacity="0.55"/>
  <path d="M0 410 Q 150 396 300 410 T 600 410 T 900 410 L 900 420 L 0 420 Z"
        fill="#9fd0ef" opacity="0.22"/>
</svg>
