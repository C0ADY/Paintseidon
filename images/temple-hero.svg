<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a63"/>
      <stop offset="100%" stop-color="#12213b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="url(#skyFade)"/>

  <!-- distant hills -->
  <path d="M0 320 Q150 280 300 310 T600 300 T900 320 V420 H0 Z" fill="#0f1c30" opacity="0.6"/>

  <!-- stepped platform (stylobate) -->
  <rect x="60" y="366" width="780" height="14" fill="#e9e2d0"/>
  <rect x="90" y="352" width="720" height="14" fill="#efe9da"/>
  <rect x="120" y="338" width="660" height="14" fill="#f5f0e6"/>

  <!-- pediment (triangular roof) -->
  <polygon points="130,338 770,338 450,220" fill="#efe9da"/>
  <polygon points="150,332 750,332 450,236" fill="#dcd2b8"/>

  <!-- entablature -->
  <rect x="130" y="330" width="640" height="16" fill="#f5f0e6"/>
  <rect x="130" y="316" width="640" height="10" fill="#c8a24a"/>

  <!-- columns -->
  <g fill="#f5f0e6">
    <rect x="150" y="236" width="26" height="94" />
    <rect x="230" y="236" width="26" height="94" />
    <rect x="310" y="236" width="26" height="94" />
    <rect x="390" y="236" width="26" height="94" />
    <rect x="470" y="236" width="26" height="94" />
    <rect x="550" y="236" width="26" height="94" />
    <rect x="630" y="236" width="26" height="94" />
    <rect x="710" y="236" width="26" height="94" />
  </g>
  <g fill="#d8cdb0">
    <rect x="146" y="228" width="34" height="10"/>
    <rect x="226" y="228" width="34" height="10"/>
    <rect x="306" y="228" width="34" height="10"/>
    <rect x="386" y="228" width="34" height="10"/>
    <rect x="466" y="228" width="34" height="10"/>
    <rect x="546" y="228" width="34" height="10"/>
    <rect x="626" y="228" width="34" height="10"/>
    <rect x="706" y="228" width="34" height="10"/>
  </g>

  <!-- column flutes (subtle) -->
  <g stroke="#d8cdb0" stroke-width="2" opacity="0.6">
    <line x1="163" y1="236" x2="163" y2="330"/>
    <line x1="243" y1="236" x2="243" y2="330"/>
    <line x1="323" y1="236" x2="323" y2="330"/>
    <line x1="403" y1="236" x2="403" y2="330"/>
    <line x1="483" y1="236" x2="483" y2="330"/>
    <line x1="563" y1="236" x2="563" y2="330"/>
    <line x1="643" y1="236" x2="643" y2="330"/>
    <line x1="723" y1="236" x2="723" y2="330"/>
  </g>

  <!-- laurel motif under pediment -->
  <circle cx="450" cy="285" r="18" fill="none" stroke="#c8a24a" stroke-width="3"/>
</svg>
